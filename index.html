<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InHyuk's Poster Hall</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Instrument+Serif&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/TextPlugin.min.js"></script>
  </head>
  <body>
    <main class="hall" id="hall">
      <div class="wall" id="wall" aria-hidden="true"></div>
      <div class="reveal" id="reveal" aria-hidden="true">
        <div class="reveal-fill" id="reveal-fill"></div>
      </div>
      <div class="focus-layer" id="focus-layer"></div>
      <div class="track" id="track"></div>
      <button class="exit-session" id="exit-session" type="button">
        Exit Session
        <img src="assets/x-circle.svg" alt="" width="16" height="16" />
      </button>
      <aside class="meta-sidebar" id="meta-sidebar">
        <div class="meta-sidebar-inner">
          <div class="meta-panel meta-panel-main" id="meta-panel-main">
            <div class="meta-main">
              <p class="meta-kicker">Active Exhibition</p>
              <h2 class="meta-title"></h2>
              <p class="meta-blurb"></p>
            </div>
            <div class="meta-details">
              <div class="meta-rule"></div>
              <p class="meta-tech-label">Technologies Used</p>
              <div class="meta-chips"></div>
              <div class="meta-links">
                <a class="meta-git" target="_blank" rel="noreferrer">
                  <img src="assets/github.svg" alt="" width="20" height="20" />
                  <span></span>
                </a>
                <p class="meta-date"></p>
              </div>
            </div>
            <a class="meta-demo" href="#" rel="noreferrer">
              Launch Interactive Demo
            </a>
          </div>
          <div class="meta-panel meta-panel-next" id="meta-panel-next">
            <div class="meta-next-video">
              <iframe
                id="meta-demo-video"
                title="Interactive Demo"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        </div>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
